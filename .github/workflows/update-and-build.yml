name: Update Versions & Build Docker Image

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Run weekly on Mondays at 06:00 UTC to check upstream and latest releases
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: 'Rebase onto upstream/master (JasonRivers/Docker-Nagios) before updating versions'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Update Dockerfile and README to latest versions
        id: versions
        run: |
          if [[ "${{ github.event.inputs.sync_upstream }}" == "true" ]]; then
            ./update-versions.sh --sync
          else
            ./update-versions.sh
          fi

          NAGIOS_VERSION=$(grep -E '^ARG NAGIOS_BRANCH=' Dockerfile | cut -d= -f2 | sed 's/^nagios-//')
          echo "nagios_version=${NAGIOS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.versions.outputs.nagios_version }},enable=${{ github.ref == 'refs/heads/master' }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit and push version updates to master
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain Dockerfile README.md)" ]]; then
            git add Dockerfile README.md
            git commit -m "chore: update to Nagios ${{ steps.versions.outputs.nagios_version }} and latest component versions [skip ci]"
          fi

          if [[ "${{ github.event.inputs.sync_upstream }}" == "true" ]]; then
            git push --force-with-lease origin HEAD:master
          elif [[ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]]; then
            git push origin HEAD:master
          else
            echo "No version changes to commit."
          fi
